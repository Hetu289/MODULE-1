<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Interaction Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Customer Interaction Form</h2>

    <!-- Submit → #success par jump -->
    <form action="#success" method="get">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" placeholder="10-digit phone number" 
                   required pattern="[0-9]{10}">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Vehicle Details</label>
            <input type="text" placeholder="Model, brand…" required>
        </div>

        <div class="form-group">
            <label>Complaint / Issue</label>
            <textarea placeholder="Describe issue…" required></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

    <!-- SUCCESS MESSAGE-->
    <div id="success" class="success-box color-green">
         Your data has been successfully submitted!
    </div>

</div>

</body>
</html>
