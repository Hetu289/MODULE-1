<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2026</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, black, #2c003e, #800080, #ff69b4);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  .card {
    text-align: center;
    padding: 40px 60px;
    border-radius: 20px;
    position: relative;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 30px rgba(255,192,203,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    animation: float 3s ease-in-out infinite;
    width: 90%;
    max-width: 400px;
  }

  h1 {
    font-size: 2.3rem;
    background: linear-gradient(90deg, #ff69b4, #ffb6c1, #ffc0cb, #fff0f5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: hue 4s linear infinite;
  }

  h2 {
    color: #ffe4ec;
    font-weight: 500;
    letter-spacing: 1px;
    margin-top: 10px;
    font-size: 1.1rem;
  }

  @keyframes hue {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Sparkle dots */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.8;
    animation: sparkle 2s ease-in-out infinite;
  }

  .sparkle:nth-child(1){ top:10%; left:20%; animation-delay:0s; }
  .sparkle:nth-child(2){ top:30%; left:80%; animation-delay:0.4s; }
  .sparkle:nth-child(3){ top:70%; left:10%; animation-delay:0.8s; }
  .sparkle:nth-child(4){ top:85%; left:60%; animation-delay:1.2s; }

  @keyframes sparkle {
    0%,100% { transform: scale(0.6); opacity:0.4; }
    50% { transform: scale(1.3); opacity:1; }
  }

  /* 🌸 Responsive Design 🌸 */
  @media (max-width: 768px) {
    .card {
      padding: 30px 40px;
    }

    h1 {
      font-size: 1.8rem;
    }

    h2 {
      font-size: 1rem;
    }
  }

  @media (max-width: 480px) {
    body {
      background: linear-gradient(135deg, black, #4b004b, #ff69b4);
      padding: 10px;
    }

    .card {
      padding: 25px 20px;
      width: 100%;
      border-radius: 15px;
    }

    h1 {
      font-size: 1.6rem;
    }

    h2 {
      font-size: 0.95rem;
    }

    .sparkle {
      width: 4px;
      height: 4px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <h1>💖 Happy New Year 💖</h1>
    <h2>Welcome with Love & Light ✨</h2>
  </div>
</body>
</html>
