<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Modal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0a0a;
            font-family: 'Poppins', sans-serif;
        }

        .modal-content {
            background: #111;
            color: #fff;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #333;
        }

        .form-control {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            background: #1a1a1a;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Contact Button -->
    <div class="text-center mt-5">
        <button class="btn btn-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#contactModal">
            Contact Me
        </button>
    </div>

    <!-- Contact Form Modal -->
    <div class="modal fade" id="contactModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header border-0">
                    <h5 class="modal-title">Get in Touch</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <form>

                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4" placeholder="Write your message..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Send Message</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
