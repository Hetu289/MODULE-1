<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Bootstrap Theme</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        
        :root {
            --bs-primary: #8b5cf6;           
            --bs-primary-rgb: 139, 92, 246;

            --bs-secondary: #0ea5e9;         
            --bs-secondary-rgb: 14, 165, 233;

            --bs-body-bg: #0a0a0a;           
            --bs-body-color: #e5e5e5;      

            --bs-border-radius: 12px;        
            --bs-border-radius-lg: 18px;
        }

        /* Custom button style */
        .btn-custom {
            background: var(--bs-primary);
            border: none;
            color: #fff;
            padding: 10px 26px;
            border-radius: var(--bs-border-radius-lg);
            transition: 0.3s ease;
        }

        .btn-custom:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: var(--bs-border-radius-lg);
        }
    </style>
</head>
<body class="p-5">

    <h2 class="text-center mb-4">Custom Bootstrap Theme</h2>

    <!-- Buttons Showcase -->
    <div class="text-center">
        <button class="btn btn-primary px-4 py-2 me-2">Primary Button</button>
        <button class="btn btn-secondary px-4 py-2 me-2">Secondary Button</button>
        <button class="btn-custom">Custom Button</button>
    </div>

    <!-- Card Showcase -->
    <div class="container mt-5">
        <div class="card p-4 text-center">
            <h4>Custom Styled Card</h4>
            <p>This card uses your customized Bootstrap variables.</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
