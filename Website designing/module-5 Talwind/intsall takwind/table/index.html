<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example with Tailwind CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Talwind CDN -->
         <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <table class="table-auto mx-auto  border border-gray-400 w-full mt-50 w-11/12 md:w-3/4 lg:w-1/2">
        <caption class="text-3xl font-bold text-center my-4">User Information</caption>
        <thead>
            <tr class="bg-pink-500 text-white text-base sm:text-sm md:text-3xl lg:text-4xl">
                <th class="p-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Name</th>
                <th class="px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Age</th>
                <th class="px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">City</th>
                <th class="px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Occupation</th>
                <th class="px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Role</th>
            </tr>
        </thead>
        <tbody>
            <tr class="bg-pink-300 text-base sm:text-sm md:text-3xl lg:text-4xl">
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Alice</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">30</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">New York</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Engineer</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Fullstack Developer</td>
            </tr>
            <tr class="bg-purple-400 text-base sm:text-sm md:text-3xl lg:text-4xl">
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Bob</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">25</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Los Angeles</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Designer</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">UI/UX Designer</td>
            </tr>
            <tr class="bg-green-400 text-base sm:text-sm md:text-3xl lg:text-4xl">
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Charlie</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">35</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Chicago</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Teacher</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Educator</td>
            </tr>
            <tr class="bg-orange-400 text-base sm:text-sm md:text-3xl lg:text-4xl">
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Diana</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">28</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Miami</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Doctor</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Surgeon</td>
            </tr>
            <tr class="bg-red-400 text-base sm:text-sm md:text-3xl lg:text-4xl">
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Ethan</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">32</td>
                <td class="border-black px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Seattle</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Developer</td>
                <td class="border px-4 py-2 text-base sm:text-sm md:text-md lg:text-lg">Backend Developer</td>
        </tbody>
    </table>






</body>

</html>
