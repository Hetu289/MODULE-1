<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        /* Sidebar */
        .sidebar {
            background-color: #000000;
            min-height: 100vh;
        }
        .sidebar a {
            color: #b3b3b3;
            text-decoration: none;
        }
        .sidebar a:hover {
            color: #1ed760; /* Spotify green */
        }
        /* Navbar */
        .navbar-custom {
            background-color: #121212;
        }
        /* Song Card */
        .song-card {
            background-color: #181818;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .song-card:hover {
            transform: scale(1.05);
        }
        .song-card img {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-4 flex-shrink-0 w-64">
            <h2 class="text-2xl font-bold text-green-500 mb-6">Spotify</h2>
            <nav class="flex flex-col gap-3">
                <a href="#" class="text-lg">Home</a>
                <a href="#" class="text-lg">Search</a>
                <a href="#" class="text-lg">Your Library</a>
            </nav>
            <hr class="my-4 border-gray-700">
            <nav class="flex flex-col gap-2 text-sm">
                <a href="#">Liked Songs</a>
                <a href="#">Recently Played</a>
                <a href="#">Create Playlist</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6">
            <!-- Navbar -->
            <div class="navbar navbar-custom flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold">Good Evening</h1>
                <button class="bg-green-500 text-black px-4 py-2 rounded-full font-bold hover:bg-green-400">Login</button>
            </div>

            <!-- Playlist Section -->
            <h2 class="text-xl font-semibold mb-4">Your Playlists</h2>
            <div class="row g-4">
                <!-- Song Card Example -->
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="song-card">
                        <img src="https://via.placeholder.com/150" alt="Album Cover">
                        <div class="p-3">
                            <h3 class="font-bold">Song Title</h3>
                            <p class="text-gray-400 text-sm">Artist Name</p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="song-card">
                        <img src="https://via.placeholder.com/150" alt="Album Cover">
                        <div class="p-3">
                            <h3 class="font-bold">Song Title</h3>
                            <p class="text-gray-400 text-sm">Artist Name</p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="song-card">
                        <img src="https://via.placeholder.com/150" alt="Album Cover">
                        <div class="p-3">
                            <h3 class="font-bold">Song Title</h3>
                            <p class="text-gray-400 text-sm">Artist Name</p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="song-card">
                        <img src="https://via.placeholder.com/150" alt="Album Cover">
                        <div class="p-3">
                            <h3 class="font-bold">Song Title</h3>
                            <p class="text-gray-400 text-sm">Artist Name</p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Add more song cards as needed -->
        </div>
    </div>
</body>
</html>
