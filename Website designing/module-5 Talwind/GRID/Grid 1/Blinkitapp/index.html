<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blinkit App Clone</title>
    <!-- TAILWIND CDN -->
         <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="https://blinkit.com/static/images/blinkit-logo.svg" alt="Blinkit Logo">
            </div>
            <div class="search-bar
">
                <input type="text" placeholder="Search for products...">
                <button>Search</button>
            </div>
            <div class="user-actions">
                <button class="login-btn">Login</button>
                <button class="cart-btn">Cart (0)</button>
            </div>
        </div>
        <div class="main-content">
            <div class="sidebar">
                <h3>Categories</h3>
                <ul>
                    <li>Fruits & Vegetables</li>
                    <li>Dairy & Bakery</li>
                    <li>Snacks & Beverages</li>
                    <li>Household Essentials</li>
                    <li>Personal Care</li>
                </ul>
            </div>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 1">
                    <h4>Product 1</h4>
                    <p>$10.00</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 2">
                    <h4>Product 2</h4>
                    <p>$15.00</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 3">
                    <h4>Product 3</h4>
                    <p>$8.00</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 4">
                    <h4>Product 4</h4>
                    <p>$12.00</p>
                    <button>Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2024 Blinkit. All rights reserved.</p>
            <icons>
                <a href="#">Facebook</a> |
                <a href="#">Twitter</a> |
                <a href="#">Instagram</a>
            </icons>
            
            <div class="app-links">
                <a href="#"><img src="https://via.placeholder.com/120x40?text=App+Store" alt="App Store"></a>
                <a href="#"><img src="https://via.placeholder.com/120x40?text=Google+Play" alt="Google Play"></a>
             </div>
        </div>
    </div>
</body>
</html>
